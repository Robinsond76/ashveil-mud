<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashveil MUD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0d0d0d;
      font-family: monospace;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #header {
      width: 100%;
      padding: 8px 16px;
      color: #c8a96e;
      font-size: 13px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    #header span { color: #888; }
    
    /* Output area - takes 2/3 of remaining space */
    #output-container {
      flex: 2;
      width: 100%;
      padding: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #terminal-output {
      flex: 1;
      width: 100%;
      background: #0d0d0d;
    }
    
    /* Input area - separated below output */
    #input-container {
      flex: 1;
      width: 100%;
      padding: 8px;
      border-top: 2px solid #333;
      display: flex;
      flex-direction: column;
      background: #111;
    }
    #terminal-input {
      flex: 1;
      width: 100%;
      background: #0d0d0d;
    }
    
    #status-bar {
      width: 100%;
      padding: 4px 16px;
      font-size: 11px;
      color: #555;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }
    #status-bar.connected { color: #4a8; }
    #status-bar.disconnected { color: #a44; }
  </style>
</head>
<body>
  <div id="header">
    <strong>⚔ ASHVEIL MUD</strong>
    <span id="conn-label">Connecting...</span>
  </div>
  
  <!-- Output section - takes 2/3 -->
  <div id="output-container">
    <div id="terminal-output"></div>
  </div>
  
  <!-- Input section - separated below -->
  <div id="input-container">
    <div id="terminal-input"></div>
  </div>
  
  <div id="status-bar" class="disconnected">Disconnected</div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="/static/terminal.js"></script>
</body>
</html>
