[project]
name = "ashveil-mud"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "websockets==13.1",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "aiofiles==24.1.0",
]

[tool.setuptools.packages.find]
include = ["server*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"