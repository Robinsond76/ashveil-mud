[project]
name = "ashveil-mud"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "websockets==13.1",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.2",
    "aiofiles==24.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0"]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"